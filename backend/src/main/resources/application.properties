# Secrets (DB_PASSWORD, JWT_SECRET, mail settings) come from environment variables or a local .env file.
# See backend/.env.example. The .env file is looked up in the working directory (backend/ or the repo root).
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

spring.application.name=wease

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/wease?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}

spring.datasource.username=${DB_USERNAME:root}

spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT Properties
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Links in emails point here
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.mail.from=${MAIL_FROM:Wease <no-reply@wease.local>}

# Wease's commission on labour charges for completed jobs (materials and visiting charges are excluded)
app.platform.commission-percent=${PLATFORM_COMMISSION_PERCENT:5}

# Never send Java stack traces to clients (dev tools would otherwise turn them on locally)
server.error.include-stacktrace=never

# Sites allowed to call the API (comma-separated; wildcards allowed, e.g. https://*.vercel.app)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# Sign-up requires Google or a phone code. Set true only for local automated tests.
app.auth.password-signup-enabled=${PASSWORD_SIGNUP_ENABLED:true}
# Google Sign-In OAuth client ID (Google Cloud Console > Credentials). Empty = Google sign-in off.
app.google.client-id=${GOOGLE_CLIENT_ID:}
# SMS provider for phone codes. 'log' writes codes to the server log (development only).
app.sms.provider=${SMS_PROVIDER:log}
