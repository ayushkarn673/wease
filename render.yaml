# Render Blueprint for the Wease API (free web service, built from backend/Dockerfile).
# Values marked sync: false are entered in the Render dashboard; they are never stored in git.
services:
  - type: web
    name: wease-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/workers
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
