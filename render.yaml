# Render Blueprint for Wease: the API (free Docker web service) and the website (free static site).
# Values marked sync: false are entered in the Render dashboard; they are never stored in git.
services:
  - type: web
    name: wease-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/workers
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false

  - type: web
    name: wease-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Every page address loads the React app, so links such as /workers/17 work on refresh.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
